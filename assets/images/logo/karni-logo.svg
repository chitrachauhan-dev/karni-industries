<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00ADB5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group: Emblem -->
  <g transform="translate(15, 10)">
    <!-- Hexagon Outer Shield -->
    <polygon points="50,2 95,27 95,78 50,103 5,78 5,27" 
             fill="url(#shieldGrad)" stroke="#00E5FF" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Hexagon Ring -->
    <polygon points="50,10 87,31 87,73 50,94 13,73 13,31" 
             fill="#08182B" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Stylized Flask / Chemical Droplet -->
    <!-- Flask Neck & Rim -->
    <rect x="44" y="24" width="12" height="6" rx="2" fill="#00E5FF" />
    <path d="M 46,30 L 46,42 L 32,68 C 29,74 34,82 42,82 L 58,82 C 66,82 71,74 68,68 L 54,42 L 54,30 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Liquid inside flask -->
    <path d="M 36,65 Q 43,62 50,65 Q 57,68 64,65 L 66,69 C 68,74 65,80 58,80 L 42,80 C 35,80 32,74 34,69 Z" 
          fill="url(#flaskLiquid)" filter="url(#glow)"/>
    
    <!-- Bubbles -->
    <circle cx="45" cy="54" r="2.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="53" cy="48" r="1.8" fill="#FFFFFF" opacity="0.8" />
    <circle cx="48" cy="72" r="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Orbital Atomic Rings -->
    <ellipse cx="50" cy="52" rx="42" ry="14" fill="none" stroke="#F59E0B" stroke-width="1.8" 
             stroke-dasharray="4,3" transform="rotate(-30 50 52)" />
    <!-- Electron particle -->
    <circle cx="86" cy="32" r="3" fill="#F59E0B" />
  </g>

  <!-- Group: Typography -->
  <!-- Main Brand Name -->
  <text x="130" y="58" font-family="'Space Grotesk', 'Montserrat', 'Arial Black', sans-serif" 
        font-size="44" font-weight="800" letter-spacing="3" fill="#FFFFFF">
    KARNI
  </text>
  <text x="290" y="58" font-family="'Space Grotesk', 'Montserrat', 'Arial', sans-serif" 
        font-size="44" font-weight="300" letter-spacing="4" fill="#00B4D8">
    INDUSTRIES
  </text>

  <!-- Tagline / Subtitle -->
  <text x="132" y="86" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="13" font-weight="600" letter-spacing="4.5" fill="#94A3B8">
    PRECISION CLEANING &amp; CHEMICAL FORMULATIONS
  </text>

  <!-- Decorative Accent Bar -->
  <rect x="132" y="96" width="380" height="3" rx="1.5" fill="url(#shieldGrad)" />
  <circle cx="512" cy="97.5" r="3.5" fill="#F59E0B" />
</svg>
