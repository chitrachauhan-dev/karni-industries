<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0C2340"/>
      <stop offset="100%" stop-color="#05101E"/>
    </linearGradient>
    <linearGradient id="beakerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#labBg)"/>

  <!-- Analytical Lab Glassware & Equipment -->
  <g transform="translate(150, 80)">
    <!-- Flask 1 -->
    <path d="M 120,60 L 120,140 L 40,280 C 30,296 42,320 62,320 L 218,320 C 238,320 250,296 240,280 L 160,140 L 160,60 Z" 
          fill="none" stroke="#7DD3FC" stroke-width="3"/>
    <path d="M 52,290 C 70,280 120,300 160,285 C 190,270 215,285 228,290 L 218,315 L 62,315 Z" fill="#00E5FF" opacity="0.75"/>
    <rect x="110" y="50" width="60" height="12" rx="3" fill="#38BDF8"/>
    <!-- Bubbles -->
    <circle cx="100" cy="260" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="140" cy="240" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="160" cy="275" r="4" fill="#FFFFFF" opacity="0.8"/>

    <!-- Burette Stand -->
    <rect x="340" y="20" width="8" height="340" fill="#94A3B8"/>
    <rect x="290" y="350" width="110" height="15" rx="3" fill="#475569"/>
    <!-- Burette Glass Tube with Markings -->
    <rect x="360" y="50" width="16" height="240" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7DD3FC" stroke-width="1.5"/>
    <line x1="360" y1="90" x2="368" y2="90" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="360" y1="130" x2="368" y2="130" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="360" y1="170" x2="368" y2="170" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="360" y1="210" x2="368" y2="210" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Stopcock -->
    <circle cx="368" cy="270" r="6" fill="#F59E0B"/>
    <rect x="366" y="276" width="4" height="25" fill="#7DD3FC"/>
  </g>

  <!-- High-Tech Spectrophotometer / Digital QC Station (Right) -->
  <g transform="translate(680, 120)">
    <!-- Main Console Housing -->
    <rect x="0" y="60" width="380" height="220" rx="16" fill="#0F1E36" stroke="#00ADB5" stroke-width="2"/>
    <!-- LCD Display Screen -->
    <rect x="30" y="90" width="220" height="130" rx="8" fill="#040D1A" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Spectral Waveform on LCD -->
    <path d="M 40,180 Q 70,110 100,160 T 150,130 T 200,170 T 240,150" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
    <text x="45" y="115" font-family="'Space Grotesk', monospace" font-size="11" fill="#10B981">
      ACTIVE BATCH: KI-FORM-902
    </text>
    <text x="45" y="130" font-family="'Space Grotesk', monospace" font-size="10" fill="#94A3B8">
      PURITY INDEX: 99.87% PASS
    </text>

    <!-- Keypad & Knobs -->
    <g fill="#1E293B" stroke="#475569" stroke-width="1.5">
      <circle cx="285" cy="110" r="14"/>
      <circle cx="330" cy="110" r="14"/>
      <rect x="270" y="145" width="28" height="18" rx="3" fill="#00ADB5"/>
      <rect x="310" y="145" width="28" height="18" rx="3" fill="#0284C7"/>
      <rect x="270" y="175" width="28" height="18" rx="3" fill="#10B981"/>
      <rect x="310" y="175" width="28" height="18" rx="3" fill="#F59E0B"/>
    </g>

    <!-- Cuvette Test Chamber -->
    <rect x="30" y="235" width="120" height="25" rx="4" fill="#071526" stroke="#64748B"/>
    <text x="90" y="251" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#00E5FF">
      CUVETTE CELL [OK]
    </text>
  </g>

  <!-- Overlay Typography -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="1040" height="46" rx="8" fill="rgba(8, 24, 43, 0.85)" stroke="#00ADB5" stroke-width="1"/>
    <text x="30" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      KARNI R&amp;D LABORATORY: <tspan fill="#38BDF8">Pioneering High-Efficacy Chemical Formulations with Zero Environmental Compromise</tspan>
    </text>
  </g>
</svg>
