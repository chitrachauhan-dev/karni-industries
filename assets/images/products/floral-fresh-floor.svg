<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="jugTranslucent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="15%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="emeraldLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="capGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="442" rx="140" ry="16" fill="#000000" opacity="0.18" filter="blur(6px)"/>

  <!-- Canister Group -->
  <g filter="url(#dropShadow)">
    <!-- Container Outline / Translucent Shell -->
    <path d="M 120,72 C 120,62 132,54 146,54 L 254,54 C 268,54 280,62 280,72 L 288,102 C 292,116 304,126 318,130 L 326,134 C 334,138 340,146 340,156 L 340,404 C 340,418 328,430 314,430 L 86,430 C 72,430 60,418 60,404 L 60,156 C 60,146 66,138 74,134 L 82,130 C 96,126 108,116 112,102 Z" 
          fill="url(#jugTranslucent)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Green Liquid Volume Inside Translucent Container -->
    <path d="M 64,190 Q 200,186 336,190 L 336,400 C 336,414 326,424 312,424 L 88,424 C 74,424 64,414 64,400 Z" 
          fill="url(#emeraldLiquid)" opacity="0.88"/>
    <!-- Liquid Meniscus Highlight -->
    <ellipse cx="200" cy="190" rx="136" ry="6" fill="#6EE7B7" opacity="0.6"/>

    <!-- Handle Opening -->
    <path d="M 148,82 L 252,82 C 260,82 266,88 266,96 C 266,108 258,118 248,118 L 152,118 C 142,118 134,108 134,96 C 134,88 140,82 148,82 Z" 
          fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Cap -->
    <rect x="94" y="42" width="36" height="16" fill="#047857"/>
    <rect x="88" y="24" width="48" height="22" rx="4" fill="url(#capGreen)"/>
    <g stroke="#34D399" stroke-width="1.5">
      <line x1="93" y1="26" x2="93" y2="44"/><line x1="99" y1="26" x2="99" y2="44"/>
      <line x1="105" y1="26" x2="105" y2="44"/><line x1="111" y1="26" x2="111" y2="44"/>
      <line x1="117" y1="26" x2="117" y2="44"/><line x1="123" y1="26" x2="123" y2="44"/>
    </g>

    <!-- Center Product Label -->
    <g transform="translate(112, 160)">
      <rect x="0" y="0" width="208" height="245" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      
      <!-- Brand Header -->
      <rect x="0" y="0" width="208" height="42" rx="7" fill="#064E3B"/>
      <text x="104" y="26" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="2">
        KARNI <tspan fill="#34D399">FLORAL</tspan>
      </text>

      <!-- Category Pill -->
      <rect x="24" y="48" width="160" height="18" rx="9" fill="#D1FAE5"/>
      <text x="104" y="61" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#047857" letter-spacing="0.5">
        pH-NEUTRAL FLOOR CLEANER
      </text>

      <!-- Main Title -->
      <text x="104" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="900" fill="#064E3B">
        FLORAL FRESH
      </text>
      <text x="104" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#059669">
        NEUTRAL CONCENTRATE
      </text>

      <line x1="20" y1="122" x2="188" y2="122" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="24" y="138" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Dilution: 1:50 to 1:100</text>
      <text x="24" y="152" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Exact pH: 7.0 (Marble Safe)</text>
      <text x="24" y="166" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Long-Lasting Floral Scent</text>
      <text x="24" y="180" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Zero Residue / No Rinse</text>

      <!-- Miniature GHS Hazard Diamond -->
      <g transform="translate(30, 192) scale(0.24)">
        <polygon points="50,3 97,50 50,97 3,50" fill="#FFFFFF" stroke="#DC2626" stroke-width="8"/>
        <path d="M 46,26 L 54,26 L 52,56 L 48,56 Z" fill="#1E293B"/>
        <circle cx="50" cy="69" r="6" fill="#1E293B"/>
      </g>

      <!-- Net Volume Badge -->
      <rect x="135" y="194" width="60" height="24" rx="4" fill="#064E3B"/>
      <text x="165" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#34D399">
        5L <tspan font-size="9" font-weight="600" fill="#FFFFFF">NET</tspan>
      </text>

      <rect x="0" y="233" width="208" height="12" rx="0 0 7 7" fill="#10B981"/>
    </g>
  </g>
</svg>
