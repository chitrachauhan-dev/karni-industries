      <text x="24" y="152" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Anti-Dust Repellent Barrier</text>
      <text x="24" y="166" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Ammonia-Free Formulation</text>
      <text x="24" y="180" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">• Fast Evaporation Dry</text>

      <g transform="translate(30, 192) scale(0.24)">
