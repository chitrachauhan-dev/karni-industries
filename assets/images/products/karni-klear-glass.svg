      <stop offset="30%" stop-color="#F0F9FF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="cyanLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
