      </text>
      <text x="78" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#E2E8F0">
        STAINLESS STEEL
      </text>
      <text x="78" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#38BDF8">
        &amp; METAL POLISH
      </text>
      <line x1="15" y1="82" x2="141" y2="82" stroke="#334155" stroke-width="1"/>
      <text x="18" y="98" font-family="sans-serif" font-size="8.5" fill="#94A3B8">• Anti-Fingerprint Film</text>
      <text x="18" y="112" font-family="sans-serif" font-size="8.5" fill="#94A3B8">• Restores Mirror Luster</text>
      <text x="18" y="126" font-family="sans-serif" font-size="8.5" fill="#94A3B8">• Elevator &amp; Railing Safe</text>
      <rect x="44" y="140" width="68" height="22" rx="4" fill="#0284C7"/>
      <text x="78" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">1 LITRE</text>
