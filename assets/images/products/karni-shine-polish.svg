<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="bottleSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="85%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="442" rx="100" ry="14" fill="#000000" opacity="0.2" filter="blur(5px)"/>
  <g filter="url(#dropShadow)">
