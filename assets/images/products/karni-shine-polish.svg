    <path d="M 175,44 L 235,44 L 245,60 L 255,60 C 262,60 268,66 268,74 L 268,85 L 225,85 L 225,115 L 175,115 L 175,85 L 145,85 L 145,74 C 145,66 151,60 158,60 Z" fill="#0F172A"/>
    <!-- Trigger Lever -->
    <path d="M 160,86 C 155,105 145,125 135,135 L 145,138 C 158,126 168,105 172,86 Z" fill="#0284C7"/>
    <!-- Nozzle -->
    <rect x="268" y="68" width="16" height="12" rx="2" fill="#0284C7"/>
    <!-- Bottle Neck & Body -->
    <path d="M 172,115 L 228,115 L 232,150 C 235,175 255,195 270,215 L 285,245 C 290,255 292,268 292,280 L 292,400 C 292,416 280,428 264,428 L 136,428 C 120,428 108,416 108,400 L 108,280 C 108,268 110,255 115,245 L 130,215 C 145,195 165,175 168,150 Z" fill="url(#bottleSilver)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Label -->
    <g transform="translate(122, 230)">
      <rect x="0" y="0" width="156" height="180" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="0" y="0" width="156" height="34" rx="7" fill="#1E293B"/>
      <text x="78" y="22" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
